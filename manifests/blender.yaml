schema_version: "1.0"
integration:
  id: "forge.blender.scene"
  name: "Blender 3D Scene Tools"
  version: "0.1.0"
  description: "Safe, background-mode Blender integration for inspecting scenes, materials, and creating primitives with copy-on-write preservation."
application:
  id: "blender"
  display_name: "Blender"
  supported_versions: ">=4.0,<6.0"
  website: "https://www.blender.org"
adapter:
  id: "forge.adapters.blender"
  version: "0.1.0"
capabilities:
  - name: "blender_scene_summary"
    handler: "blender.scene_summary"
    description: "Return a structured summary of a Blender scene: object count, types, cameras, lights, and collections."
    risk: "read"
    timeout_seconds: 45
    input_schema:
      type: object
      properties:
        blend_file: { type: string, description: "Relative or absolute path to .blend file within workspace." }
      required: [blend_file]
      additionalProperties: false
    output_schema:
      type: object
      properties:
        object_count: { type: integer }
        object_types: { type: object }
        cameras: { type: array, items: { type: string } }
        lights: { type: array, items: { type: string } }
        collections: { type: array, items: { type: string } }
        blender_version: { type: string }
      required: [object_count, object_types, blender_version]

  - name: "blender_list_objects"
    handler: "blender.list_objects"
    description: "List objects in the scene with bounded transforms, types, and parent relationships."
    risk: "read"
    timeout_seconds: 45
    input_schema:
      type: object
      properties:
        blend_file: { type: string }
        limit: { type: integer, minimum: 1, maximum: 200, default: 50 }
      required: [blend_file]
      additionalProperties: false
    output_schema:
      type: object
      properties:
        objects:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              type: { type: string }
              location: { type: array, items: { type: number } }
              rotation_euler: { type: array, items: { type: number } }
              scale: { type: array, items: { type: number } }
            required: [name, type, location]
        total: { type: integer }
      required: [objects, total]

  - name: "blender_inspect_object"
    handler: "blender.inspect_object"
    description: "Retrieve an object by exact name, returning dimensions, materials, and hierarchy."
    risk: "read"
    timeout_seconds: 45
    input_schema:
      type: object
      properties:
        blend_file: { type: string }
        object_name: { type: string, minLength: 1 }
      required: [blend_file, object_name]
      additionalProperties: false
    output_schema:
      type: object
      properties:
        name: { type: string }
        type: { type: string }
        location: { type: array, items: { type: number } }
        rotation_euler: { type: array, items: { type: number } }
        scale: { type: array, items: { type: number } }
        dimensions: { type: array, items: { type: number } }
        materials: { type: array, items: { type: string } }
        parent: { type: ["string", "null"] }
      required: [name, type, location, dimensions]

  - name: "blender_list_materials"
    handler: "blender.list_materials"
    description: "List material names and bounded metadata from the scene."
    risk: "read"
    timeout_seconds: 45
    input_schema:
      type: object
      properties:
        blend_file: { type: string }
      required: [blend_file]
      additionalProperties: false
    output_schema:
      type: object
      properties:
        materials:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              use_nodes: { type: boolean }
              user_count: { type: integer }
            required: [name]
        total: { type: integer }
      required: [materials, total]

  - name: "blender_create_primitive"
    handler: "blender.create_primitive"
    description: "Create an allowed primitive (cube, sphere, cylinder, plane) in a NEW copy-on-write scene file."
    risk: "write"
    timeout_seconds: 60
    input_schema:
      type: object
      properties:
        blend_file: { type: string, description: "Input .blend file (preserved unchanged)" }
        output_file: { type: string, description: "Target new .blend file to create" }
        primitive_type: { type: string, enum: ["cube", "sphere", "cylinder", "plane"] }
        name: { type: string, minLength: 1, maxLength: 64 }
        location:
          type: array
          items: { type: number }
          minItems: 3
          maxItems: 3
          default: [0.0, 0.0, 0.0]
        size: { type: number, minimum: 0.01, maximum: 1000.0, default: 2.0 }
      required: [blend_file, output_file, primitive_type, name]
      additionalProperties: false
    output_schema:
      type: object
      properties:
        success: { type: boolean }
        created_name: { type: string }
        output_file: { type: string }
        source_preserved: { type: boolean }
      required: [success, created_name, output_file, source_preserved]

  - name: "blender_set_transform"
    handler: "blender.set_transform"
    description: "Change location, rotation, or scale on a named object in a NEW copy-on-write scene file."
    risk: "write"
    timeout_seconds: 60
    input_schema:
      type: object
      properties:
        blend_file: { type: string }
        output_file: { type: string }
        object_name: { type: string, minLength: 1 }
        location: { type: array, items: { type: number }, minItems: 3, maxItems: 3 }
        rotation_euler: { type: array, items: { type: number }, minItems: 3, maxItems: 3 }
        scale: { type: array, items: { type: number }, minItems: 3, maxItems: 3 }
      required: [blend_file, output_file, object_name]
      additionalProperties: false
    output_schema:
      type: object
      properties:
        success: { type: boolean }
        object_name: { type: string }
        output_file: { type: string }
      required: [success, object_name, output_file]

  - name: "blender_rename_object"
    handler: "blender.rename_object"
    description: "Rename an object after validation in a NEW copy-on-write scene file."
    risk: "write"
    timeout_seconds: 60
    input_schema:
      type: object
      properties:
        blend_file: { type: string }
        output_file: { type: string }
        old_name: { type: string, minLength: 1 }
        new_name: { type: string, minLength: 1, maxLength: 64 }
      required: [blend_file, output_file, old_name, new_name]
      additionalProperties: false
    output_schema:
      type: object
      properties:
        success: { type: boolean }
        renamed_from: { type: string }
        renamed_to: { type: string }
        output_file: { type: string }
      required: [success, renamed_from, renamed_to, output_file]

  - name: "blender_save_scene_copy"
    handler: "blender.save_scene_copy"
    description: "Safely create a copy of the given scene file at a new destination path."
    risk: "write"
    timeout_seconds: 45
    input_schema:
      type: object
      properties:
        blend_file: { type: string }
        output_file: { type: string }
      required: [blend_file, output_file]
      additionalProperties: false
    output_schema:
      type: object
      properties:
        success: { type: boolean }
        output_file: { type: string }
      required: [success, output_file]

policy:
  default: "deny"
  read_operations: "allow_within_workspace"
  write_operations: "explicit_approval"
  network_operations: "deny"
