[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "forge-integration-platform"
version = "0.1.0"
description = "Local-first AI integration development desktop platform: build, verify, secure, and package MCP connectors."
readme = "README.md"
authors = [
    { name = "FORGE Project Team", email = "forge-dev@example.local" }
]
license = { text = "Apache-2.0" }
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.10.0",
    "pyyaml>=6.0",
    "jinja2>=3.1.0",
    "jsonschema>=4.20.0",
    "mcp>=2.3.0",
    "mcp-types>=2.3.0",
    "typer>=0.12.0",
    "rich>=13.0.0",
    "platformdirs>=4.0.0",
    "PySide6>=6.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-qt>=4.4.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
    "types-PyYAML>=6.0.0",
]

[project.scripts]
forge = "forge.cli:app"

[project.gui-scripts]
forge-gui = "forge.ui.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
forge = [
    "templates/*.j2",
    "schemas/*.json",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --strict-markers"
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "unit: Quick unit tests without external processes",
    "integration: Multi-component integration tests",
    "contract: MCP stdio contract verification tests",
    "security: Security boundaries and negative tests",
    "ui: Headless Qt UI tests",
    "blender_live: Tests requiring actual installed Blender binary",
]
